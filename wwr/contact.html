<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Rapid Riders Rafting</title>
    <meta name="description"
      content="Rapid Riders Company Contact Info, Basic information including contact details and where to reach us">
    <meta name="author" content="Cale Bodily">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img class="logo" src="images/z-boat.jpg" alt="White Water Rafting Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div>
            <h1>Rapid Riders</h1>
            <p class="contact">123 Civic Center Boulavard</p>
            <p class="contact">Fairfield, California</p>
            <p class="contact">+1 999 999 9999</p>
            <p class="contact">info@rapidriders.com</p>
        </div>
        <section class="form">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d2721.58125998731!2d-122.03680463653374!3d38.23973826418549!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1780767850514!5m2!1sen!2sus"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"></iframe>
            <form>
                <div class="quiz-item">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="quiz-item">
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" required>
                </div>
                <div class="quiz-item radio">
                    <div class="radio-pos">
                        <label for="general">Message Purpose</label>
                    </div>
                    <div class="radio-pos2">
                        <label for="general">General Inquiry</label>
                        <input type="radio" id="general" name="message" required>
                    </div>
                    <div class="radio-pos2">
                        <label for="question">Question</label>
                        <input type="radio" id="question" name="message" required>
                    </div>
                    <div class="radio-pos2">
                        <label for="website">Website Suggestion</label>
                        <input type="radio" id="website" name="message" required>
                    </div>
                </div>
                <div class="quiz-item">
                    <label for="message2">Message</label>
                    <textarea class="textarea" id="message2" name="message2" required></textarea>
                </div>
                <div class="quiz-item">
                    <label><input type="checkbox" id="newsletter" name="newsletter"> Please
                        Subscribe me
                        to the monthly newsletter</label>
                </div>
                <button class="quiz-item" type="submit">Submit Form</button>
            </form>
        </section>
        <section class="employee">
            <h2 class="serve">We are Here to Serve You</h2>
            <figure>
                <img src=" images/employee1.jpg" alt="Dan Foxer">
                <figcaption class="indent">Dan Foxer</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.jpg" alt="Ethan Baker">
                <figcaption class="indent">Ethan Baker</figcaption>
            </figure>
            <figure>
                <img src="images/employee3.jpg" alt="Kyle Jobs">
                <figcaption class="indent">Kyle Jobs</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 - Rapid Riders - Cale Bodily</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/">
                <img src="images/facebook.png" alt="Facebook Home Page">
            </a>
            <a href="https://x.com/">
                <img src="images/twitter.png" alt="Twitter Home page">
            </a>
            <a href="https://www.youtube.com/">
                <img src="images/youtube.png" alt="Youtube Home page">
            </a>
        </nav>
    </footer>
</body>

</html>
